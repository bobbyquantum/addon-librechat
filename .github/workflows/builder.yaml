name: Builder

env:
  MONITORED_FILES: "config.yaml Dockerfile rootfs"

on:
  push:
    branches:
      - main
      - canary
  pull_request:
    branches:
      - main
      - canary

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47
        with:
          separator: " "

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Get changed add-ons
        id: changed_addons
        run: |
          declare -a changed_addons
          for addon in ${{ steps.addons.outputs.addons }}; do
            if [[ "${{ steps.changed_files.outputs.all_changed_files }}" =~ $addon ]]; then
              for file in ${{ env.MONITORED_FILES }}; do
                  if [[ "${{ steps.changed_files.outputs.all_changed_files }}" =~ $addon/$file ]]; then
                    if [[ ! "${changed_addons[@]}" =~ $addon ]]; then
                      changed_addons+=("\"${addon}\",");
                    fi
                  fi
              done
            fi
          done

          changed=$(echo ${changed_addons[@]} | rev | cut -c 2- | rev)

          if [[ -n ${changed} ]]; then
            echo "Changed add-ons: $changed";
            echo "changed=true" >> $GITHUB_OUTPUT;
            echo "addons=[$changed]" >> $GITHUB_OUTPUT;
          else
            echo "No add-on had any monitored files changed (${{ env.MONITORED_FILES }})";
          fi
  build:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        arch: ["amd64"]
    permissions:
      contents: read
      id-token: write # Cosign signing
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      # Outputs of this helper are JSON-encoded, strings include their quotes
      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if add-on should be built
        id: check
        run: |
          if [[ "${{ steps.info.outputs.image }}" == "null" ]]; then
            echo "Image property is not defined, skipping build"
            echo "build_arch=false" >> $GITHUB_OUTPUT;
          elif [[ "${{ steps.info.outputs.architectures }}" =~ ${{ matrix.arch }} ]]; then
            echo "build_arch=true" >> $GITHUB_OUTPUT;

            # Expand {arch} in the config.yaml image name, e.g.
            # ghcr.io/bobbyquantum/{arch}-addon-librechat-canary
            image=$(echo "${{ steps.info.outputs.image }}" | sed 's/{arch}/${{ matrix.arch }}/')

            # Determine image suffix based on branch
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              # Main branch: remove -canary suffix if present
              image=$(echo "$image" | sed 's/-canary$//')
            elif [[ ! "$image" =~ -canary$ ]]; then
              # Other branches (including canary): keep -canary suffix
              image="${image}-canary"
            fi

            echo "image=$image" >> $GITHUB_OUTPUT;
            if [[ -z "${{ github.head_ref }}" ]] && [[ "${{ github.event_name }}" == "push" ]]; then
              echo "push=true" >> $GITHUB_OUTPUT;
            else
              echo "push=false" >> $GITHUB_OUTPUT;
            fi
          else
            echo "${{ matrix.arch }} is not a valid arch for ${{ matrix.addon }}, skipping build";
            echo "build_arch=false" >> $GITHUB_OUTPUT;
          fi

      - name: Build ${{ matrix.addon }} add-on
        if: steps.check.outputs.build_arch == 'true'
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./${{ matrix.addon }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ steps.check.outputs.image }}
          image-tags: |
            ${{ fromJSON(steps.info.outputs.version) }}
            latest
          version: ${{ fromJSON(steps.info.outputs.version) }}
          push: ${{ steps.check.outputs.push }}
          cache-gha-scope: ${{ matrix.addon }}
          labels: |
            io.hass.type=addon
            io.hass.name=${{ fromJSON(steps.info.outputs.name) }}
            io.hass.description=${{ fromJSON(steps.info.outputs.description) }}
            io.hass.url=${{ fromJSON(steps.info.outputs.url) }}
